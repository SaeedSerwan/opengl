<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenGL Classroom</title>
<meta name="description" content="Learn computer graphics by writing C++ and OpenGL (GLUT) in your browser. Nothing to install.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/codemirror/lib/codemirror.css">
<link rel="stylesheet" href="css/style.css">
<script>
  // apply the saved theme before first paint
  try { const t = localStorage.getItem('oglc:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<header class="topbar">
  <button class="icon-btn" id="btn-lessons" title="Show / hide lessons" aria-label="Show or hide lessons">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
  </button>
  <div class="brand">
    <svg class="logo" viewBox="0 0 153 254" width="18" height="30" role="img" aria-label="University of Technology Bahrain"><g fill="#d1204a"><rect x="0" y="0" width="71" height="28"/><rect x="82" y="0" width="71" height="28"/><rect x="0" y="38" width="153" height="28"/><rect x="0" y="75" width="35" height="29"/><rect x="0" y="113" width="153" height="28"/><rect x="0" y="151" width="35" height="28"/><rect x="0" y="188" width="153" height="29"/><rect x="0" y="226" width="153" height="28"/></g></svg>
    <div class="brand-text">
      <div class="brand-name">OpenGL Classroom</div>
      <div class="brand-sub">Learn graphics by writing C++</div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="toolbar">
    <button class="btn" id="btn-open" title="Open a .cpp file from your computer">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>Open</span></button>
    <button class="btn" id="btn-download" title="Save your code as a .cpp file (Ctrl+S)">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Download</span></button>
    <button class="btn" id="btn-share" title="Copy a link that contains your code">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Share</span></button>
    <button class="btn" id="btn-reset" title="Put the lesson's original example back in the editor">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Reset</span></button>
    <button class="icon-btn" id="btn-theme" title="Switch dark / light theme" aria-label="Switch theme">
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" fill="currentColor"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button class="btn btn-stop" id="btn-stop" title="Stop the running program" disabled>
      <svg viewBox="0 0 24 24" width="14" height="14"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg>
      <span>Stop</span></button>
    <button class="btn btn-run" id="btn-run" title="Compile and run (Ctrl+Enter)">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>
      <span id="run-label">Run</span><kbd>Ctrl+Enter</kbd></button>
  </div>
  <input type="file" id="file-input" accept=".cpp,.cc,.cxx,.c,.h,.hpp,.txt" hidden>
</header>

<div class="workspace" id="workspace">
  <aside class="sidebar" id="sidebar" aria-label="Lessons">
    <div class="side-tabs" role="tablist">
      <button class="side-tab active" data-tab="lessons" role="tab">Lessons</button>
      <button class="side-tab" data-tab="reference" role="tab">Reference</button>
    </div>
    <div class="side-pane" id="pane-lessons">
      <ol class="lesson-list" id="lesson-list"></ol>
      <article class="lesson" id="lesson-view" hidden></article>
    </div>
    <div class="side-pane" id="pane-reference" hidden></div>
  </aside>

  <main class="main" id="main">
    <div class="panes" id="panes">
      <section class="pane editor-pane" id="editor-pane" aria-label="C++ code editor">
        <div class="pane-head">
          <span class="file-tab"><svg viewBox="0 0 24 24" width="14" height="14"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z M14 3v6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span id="file-name">main.cpp</span><span class="dirty" id="dirty-dot" hidden>●</span></span>
          <span class="pane-hint" id="editor-hint">C++17 · Clang</span>
        </div>
        <div class="editor-host" id="editor-host"></div>
      </section>

      <div class="splitter-v" id="splitter-v" role="separator" aria-orientation="vertical" title="Drag to resize"></div>

      <section class="pane view-pane" id="view-pane" aria-label="Graphics output">
        <div class="pane-head">
          <span class="pane-title">Graphics Output</span>
          <span class="win-title" id="win-title"></span>
          <span class="spacer"></span>
          <span class="chip" id="canvas-size" title="Window size set by glutInitWindowSize">—</span>
          <button class="tbtn" id="btn-grid" aria-pressed="false" title="Show a coordinate grid">Grid</button>
          <button class="tbtn" id="btn-axes" aria-pressed="false" title="Show the X and Y axes">Axes</button>
          <button class="tbtn" id="btn-zoom" title="Switch between fit-to-panel and actual pixel size">Fit</button>
          <button class="tbtn" id="btn-resetview" title="Reset the view (fit to panel)">Reset View</button>
        </div>
        <div class="stage" id="stage">
          <div class="stage-inner" id="stage-inner">
            <div class="canvas-box" id="canvas-box">
              <div class="placeholder" id="placeholder">
                <svg viewBox="0 0 24 24" width="42" height="42"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>
                <p>Press <b>Run</b> to compile your C++ program.<br>Its graphics will appear here.</p>
              </div>
              <canvas class="overlay" id="overlay"></canvas>
            </div>
          </div>
          <div class="menu-popup" id="menu-popup" hidden></div>
        </div>
        <div class="view-foot">
          <span id="mouse-pos">Mouse: —</span>
          <span class="spacer"></span>
          <span class="foot-hint" id="focus-hint">Click the picture to send keyboard input to your program</span>
        </div>
      </section>
    </div>

    <div class="splitter-h" id="splitter-h" role="separator" aria-orientation="horizontal" title="Drag to resize"></div>

    <section class="output" id="output" aria-label="Output and errors">
      <div class="out-head">
        <button class="out-toggle" id="btn-out-toggle" aria-expanded="true" title="Show / hide the output panel">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Output
        </button>
        <span class="status" id="status" data-kind="idle"><span class="dot"></span><span id="status-text">Loading the C++ compiler…</span></span>
        <span class="spacer"></span>
        <button class="tbtn" id="btn-stdin" aria-pressed="false" title="Text your program can read with cin / scanf">Program input</button>
        <button class="tbtn" id="btn-clear" title="Clear the output">Clear Output</button>
      </div>
      <div class="out-body" id="out-body">
        <div class="stdin-box" id="stdin-box" hidden>
          <label for="stdin">Program input (read by <code>cin</code> / <code>scanf</code> when you press Run):</label>
          <textarea id="stdin" rows="2" spellcheck="false" placeholder="e.g. 5 10"></textarea>
        </div>
        <div class="out-log" id="out-log" role="log" aria-live="polite"></div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="vendor/codemirror/lib/codemirror.js"></script>
<script src="vendor/codemirror/mode/clike/clike.js"></script>
<script src="vendor/codemirror/addon/edit/matchbrackets.js"></script>
<script src="vendor/codemirror/addon/edit/closebrackets.js"></script>
<script src="vendor/codemirror/addon/selection/active-line.js"></script>
<script src="vendor/codemirror/addon/comment/comment.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
